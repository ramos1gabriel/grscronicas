<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Downloads — GRS Crônicas</title>

<body><a class="skip" href="#conteudo">Pular para o conteúdo</a>
    <!-- Edite o cabeçalho em /partials/header.html. -->
    <header data-site-header><a href="/">GRS Crônicas — Home</a></header>
    <main id="conteudo">
        <section class="page-title">
            <p class="eyebrow">TRADUÇÕES · PT-BR</p>
            <h1>Histórias sem<br><em>barreira de idioma.</em></h1>
            <p>Traduções de jogos feita pelo GRS Crônicas.</p>
        </section>
        <section class="downloads" data-download-list aria-live="polite">
            <p>Carregando traduções…</p>
        </section>
        <!-- Mensagem editável exibida quando não há traduções cadastradas. -->
        <template id="downloads-empty">
            <section class="empty-download"><span class="file-symbol" aria-hidden="true">PT<br>BR</span>
                <div>
                    <p class="eyebrow">EM PREPARAÇÃO</p>
                    <h2>Um espaço para novas histórias.</h2>
                    <p>Os arquivos ainda não estão disponíveis. Quando uma tradução for publicada, você encontrará aqui
                        o
                        download, a versão compatível e as instruções de instalação.</p><a class="text-link"
                        href="https://www.youtube.com/@grscronicas" target="_blank" rel="noopener noreferrer">Acompanhe
                        o
                        projeto no YouTube ↗</a>
                </div>
            </section>
        </template>
        <noscript>
            <p>Ative o JavaScript para consultar as traduções disponíveis.</p>
        </noscript>
    </main>
    <!-- Edite o rodapé em /partials/footer.html. -->
    <footer data-site-footer><a href="/contato/">Contato</a></footer>
    <script type="module" src="/downloads.js"></script>
    <script type="module" src="/layout.js"></script>
</body>

</html>
